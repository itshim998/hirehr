name: Website regression checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check js/main.js
          node --check js/ui.js
          node --check worker/index.js
          python -m py_compile tools/build_inner_pages.py tools/verify_site.py tools/verify_content.py tools/verify_text_unchanged.py
      - name: Static site and Worker regression tests
        run: node --test tests/*.test.mjs
